<style>
  :root{
    --paper:#F6F2E9;
    --paper-deep:#EFE9DA;
    --line:#D9CFBB;
    --line-strong:#C3B79E;
    --ink:#1E2A38;
    --ink-soft:#5B6672;
    --ink-faint:#8B8477;
    --green:#1F5C4A;
    --green-dark:#163F33;
    --green-pale:#E4EEE9;
    --blue:#2B4C7E;
    --blue-pale:#E7ECF3;
    --red:#8C2F2F;
    --red-pale:#F3E7E5;
    --amber:#9C6B1F;
    --amber-pale:#F3ECDD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    font-size:15px;
    line-height:1.5;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums;}
  #root{min-height:100vh;}

  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:236px; flex-shrink:0;
    background:var(--green-dark);
    color:#EDE7D8;
    display:flex; flex-direction:column;
    border-right:1px solid var(--line-strong);
  }
  .sidebar-head{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid rgba(237,231,216,0.18);
  }
  .sidebar-head .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.06em;
    color:#B7C9C0; text-transform:none;
  }
  .sidebar-head h1{
    font-size:19px; margin:4px 0 0 0; font-weight:600; line-height:1.25;
  }
  .nav-group{padding:14px 0;}
  .nav-group-label{
    padding:6px 20px; font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; color:#8FA79C; letter-spacing:0.04em;
  }
  .nav-item{
    display:flex; align-items:baseline; gap:10px;
    padding:8px 20px; cursor:pointer;
    color:#D9D2C2; font-size:14.5px;
    border-left:2px solid transparent;
  }
  .nav-item .num{font-family:'IBM Plex Mono', monospace; font-size:11px; color:#7C9A8D; width:16px; flex-shrink:0;}
  .nav-item:hover{background:rgba(237,231,216,0.06);}
  .nav-item.active{
    background:rgba(237,231,216,0.1);
    border-left:2px solid #C9A24A;
    color:#FBF8EF; font-weight:600;
  }
  .nav-item.active .num{color:#C9A24A;}
  .sidebar-foot{
    margin-top:auto; padding:16px 20px; border-top:1px solid rgba(237,231,216,0.18);
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:#8FA79C;
  }

  /* Main */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 32px; border-bottom:1px solid var(--line-strong);
    background:var(--paper-deep);
  }
  .topbar .empresa{font-size:14px; color:var(--ink-soft);}
  .topbar .empresa b{color:var(--ink);}
  .role-switch{display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft);}
  .role-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    padding:5px 11px; border:1px solid var(--line-strong); background:var(--paper);
    color:var(--ink-soft); cursor:pointer;
  }
  .role-btn.active{background:var(--green); border-color:var(--green); color:#fff;}

  .content{padding:30px 36px 60px 36px; max-width:1080px;}
  .screen-eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint); margin-bottom:6px;}
  h2.screen-title{font-size:24px; margin:0 0 4px 0; font-weight:600;}
  .screen-sub{color:var(--ink-soft); font-size:14px; margin:0 0 26px 0; max-width:640px;}

  .panel{background:#fff; border:1px solid var(--line-strong); margin-bottom:22px;}
  .panel-head{
    padding:12px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper-deep);
  }
  .panel-head h3{margin:0; font-size:15px; font-weight:600;}
  .panel-body{padding:16px 18px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-weight:500;
    font-size:10.5px; letter-spacing:0.03em; color:var(--ink-faint);
    padding:0 10px 8px 10px; border-bottom:1px solid var(--line-strong);
  }
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono', monospace;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--green-pale);}

  .status{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    padding:2px 8px; border:1px solid; letter-spacing:0.02em;
  }
  .status.rascunho{color:var(--ink-faint); border-color:var(--ink-faint); background:#F1EEE6;}
  .status.enviado{color:var(--amber); border-color:var(--amber); background:var(--amber-pale);}
  .status.aprovado{color:var(--green); border-color:var(--green); background:var(--green-pale);}
  .status.correcao{color:var(--red); border-color:var(--red); background:var(--red-pale);}

  .btn{
    font-family:'Source Serif 4', serif; font-size:13.5px; font-weight:600;
    padding:7px 14px; border:1px solid var(--ink); background:var(--ink); color:#fff;
    cursor:pointer;
  }
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn.green{background:var(--green); border-color:var(--green);}
  .btn.red{background:var(--red); border-color:var(--red);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; margin-top:14px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin-bottom:5px; letter-spacing:0.02em;}
  .field input, .field select, .field textarea{
    width:100%; font-family:'Source Serif 4', serif; font-size:14px;
    padding:8px 10px; border:1px solid var(--line-strong); background:var(--paper);
    color:var(--ink);
  }
  .field textarea{min-height:56px; resize:vertical;}
  .field input.mono, .field select.mono{font-family:'IBM Plex Mono', monospace;}

  .helper-note{
    font-size:12.5px; color:var(--ink-soft); border-left:2px solid var(--line-strong);
    padding:6px 12px; margin:10px 0; background:var(--paper-deep);

  .balance-check{

    padding:9px 12px; margin-top:10px; border:1px solid;

  .balance-check.ok{color:var(--green); border-color:var(--green); background:var(--green-pale);}
  .balance-check.bad{color:var(--red); border-color:var(--red); background:var(--red-pale);}

  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .kpi{background:#fff; border:1px solid var(--line-strong); padding:14px 16px;}
  .kpi .kpi-label{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin-bottom:8px;}
  .kpi .kpi-value{font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:600; color:var(--ink);}
  .kpi.warn .kpi-value{color:var(--amber);}
  .kpi.ok .kpi-value{color:var(--green);}
  .kpi.bad .kpi-value{color:var(--red);}

  .dre-row{display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px;}
  .dre-row.total{font-weight:700; border-top:1px solid var(--line-strong); border-bottom:none; margin-top:4px; padding-top:10px;}
  .dre-row.sub{padding-left:18px; color:var(--ink-soft); font-size:13.5px;}
  .dre-row .val{font-family:'IBM Plex Mono', monospace;}
  .dre-row.clickable{cursor:pointer;}
  .dre-row.clickable:hover{background:var(--green-pale);}

  .bp-cols{display:grid; grid-template-columns:1fr 1fr; gap:0;}
  .bp-col{padding:16px 18px;}
  .bp-col + .bp-col{border-left:1px solid var(--line-strong);}
  .bp-group-label{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin:14px 0 6px 0;}
  .bp-group-label:first-child{margin-top:0;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(30,42,56,0.5);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{background:#fff; border:1px solid var(--line-strong); width:560px; max-width:100%; max-height:80vh; overflow:auto;}
  .modal-head{padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--paper-deep);}
  .modal-head h3{margin:0; font-size:15px;}
  .modal-body{padding:16px 20px;}
  .modal-close{cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); background:none; border:none;}

  .breadcrumb-trail{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .breadcrumb-trail span{color:var(--green);}

  .tag-pill{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    padding:2px 7px; background:var(--blue-pale); color:var(--blue); margin-right:5px;
  }
  .empty-state{padding:34px 18px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

  .partida-row{display:grid; grid-template-columns:2fr 90px 110px 110px 30px; gap:8px; align-items:center; margin-bottom:8px;}
  .partida-row select, .partida-row input{padding:7px 8px; font-size:13px;}
  .remove-partida{background:none; border:none; color:var(--red); cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:16px; line-height:1;}
</style>
</head>

/* ============================================================
   FUNÇÕES DE PROCESSAMENTO
   (Diário aprovado → Razão → Balancete → ARE/DRE → Balanço)
   ============================================================ */

function contaInfo(codigo, contas){ return contas.find(c => c.codigo === codigo); }

function lancamentosAprovados(lancamentos){
  return lancamentos.filter(l => l.status === "aprovado");
}

function calcularRazao(lancamentos, contas){
  const aprovados = lancamentosAprovados(lancamentos);
  const porConta = {};
  contas.forEach(c => porConta[c.codigo] = { conta:c, movimentos:[], totalD:0, totalC:0 });
  aprovados.forEach(l => {
    l.partidas.forEach(p => {
      const bucket = porConta[p.conta];
      if(!bucket) return;
      bucket.movimentos.push({ data:l.data, historico:l.historico, documento:l.documento, tipo:p.tipo, valor:p.valor, lancamentoId:l.id });
      if(p.tipo === "D") bucket.totalD += p.valor; else bucket.totalC += p.valor;
    });
  });
  return porConta;
}

function saldoConta(bucket){
  const c = bucket.conta;
  const saldo = c.natureza === "devedora" ? (bucket.totalD - bucket.totalC) : (bucket.totalC - bucket.totalD);
  return saldo;
}

function calcularBalancete(razao){
  return Object.values(razao).filter(b => b.movimentos.length > 0);
}

function calcularDRE(razao){
  const linhas = Object.values(razao).filter(b => b.conta.destino === "DRE" && b.movimentos.length > 0);
  const receitaBruta = linhas.filter(l => l.conta.grupo===4 && l.conta.subgrupo==="Receita Bruta de Vendas").reduce((s,l)=>s+saldoConta(l),0);
  const deducoes = linhas.filter(l => l.conta.grupo===4 && l.conta.redutora).reduce((s,l)=>s+saldoConta(l),0);
  const cmv = linhas.filter(l => l.conta.codigo.startsWith("6.2")).reduce((s,l)=>s+saldoConta(l),0);
  const despesasOp = linhas.filter(l => l.conta.grupo===5 && l.conta.subgrupo!=="Despesas Financeiras").reduce((s,l)=>s+saldoConta(l),0);
  const receitasFin = linhas.filter(l => l.conta.grupo===4 && l.conta.subgrupo==="Receitas Financeiras").reduce((s,l)=>s+saldoConta(l),0);
  const despesasFin = linhas.filter(l => l.conta.grupo===5 && l.conta.subgrupo==="Despesas Financeiras").reduce((s,l)=>s+saldoConta(l),0);
  const receitaLiquida = receitaBruta - deducoes;
  const resultadoBruto = receitaLiquida - cmv;
  const resultadoFinanceiro = receitasFin - despesasFin;
  const resultadoExercicio = resultadoBruto - despesasOp + resultadoFinanceiro;
  return { linhas, receitaBruta, deducoes, cmv, despesasOp, receitasFin, despesasFin, receitaLiquida, resultadoBruto, resultadoFinanceiro, resultadoExercicio };
}

function calcularBP(razao, resultadoExercicio){
  const ativos = Object.values(razao).filter(b => b.conta.grupo===1 && b.movimentos.length > 0);
  const passivos = Object.values(razao).filter(b => b.conta.grupo===2 && b.movimentos.length > 0);
  const pl = Object.values(razao).filter(b => b.conta.grupo===3 && b.movimentos.length > 0);
  const totalAtivo = ativos.reduce((s,l)=>s+saldoConta(l),0);
  const totalPassivo = passivos.reduce((s,l)=>s+saldoConta(l),0);
  const totalPLContas = pl.reduce((s,l)=>s+saldoConta(l),0);
  const totalPL = totalPLContas + resultadoExercicio;
  return { ativos, passivos, pl, totalAtivo, totalPassivo, totalPL, fecha: Math.abs(totalAtivo - (totalPassivo + totalPL)) < 0.005 };
}

function fmt(v){
  const n = Number(v)||0;
  return n.toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function prazoEfetivo(aluno, turma){
  return aluno.prazoIndividual || turma.prazoUnidadeII || "";
}
function diasAtraso(dataEntrega, prazo){
  if(!prazo) return 0;
  const fim = dataEntrega || new Date().toISOString().slice(0,10);
  const d1 = new Date(prazo+"T00:00:00"), d2 = new Date(fim+"T00:00:00");
  const dias = Math.round((d2-d1)/86400000);
  return Math.max(0, dias);
}
function fmtData(iso){
  if(!iso) return "—";
  const [a,m,d] = iso.split("-");
  return d+"/"+m+"/"+a;
}
function descontoSugerido(dias, turma){
  if(dias <= 0) return 0;
  return (turma.penalidadeAtrasoFixa||0) + (dias-1) * (turma.descontoPorDiaAtraso||0);
}
function descontoEfetivo(aluno, turma){
  const dias = diasAtraso(aluno.dataEntrega, prazoEfetivo(aluno, turma));
  return aluno.descontoManual ? (aluno.desconto||0) : descontoSugerido(dias, turma);
}
function estatisticasAluno(matricula, dadosAlunos){
  const lancamentos = dadosAlunos[matricula]?.lancamentos || [];
  return {
    pendentes: lancamentos.filter(l=>l.status==="enviado").length,
    aprovados: lancamentos.filter(l=>l.status==="aprovado").length,
  };
}

function TelaDocumentos({onAbrir, role, turma, setTurmas, turmas, catalogo, setCatalogo}){
  const [criando, setCriando] = useState(false);
  const [editandoDoc, setEditandoDoc] = useState(null);
  const [importando, setImportando] = useState(false);
  const [resumoImportacao, setResumoImportacao] = useState(null);
  const liberados = documentosDaTurma(turma, catalogo);

  function toggleLiberado(docId){
    const jaLiberado = turma.documentosIds.includes(docId);
    const novosIds = jaLiberado ? turma.documentosIds.filter(id=>id!==docId) : [...turma.documentosIds, docId];
    setTurmas(turmas.map(t => t.id===turma.id ? {...t, documentosIds:novosIds} : t));
  }

  async function importarZip(file){
    setImportando(true);
    setResumoImportacao(null);
    try{
      const zip = await window.JSZip.loadAsync(file);
      const pdfEntries = Object.values(zip.files).filter(f => !f.dir && /\.pdf$/i.test(f.name));
      const idsAtuais = catalogo.map(d=>d.id);
      const novosRascunhos = [];
      let ignorados = 0;
      pdfEntries.forEach(entry => {
        const nomeArquivo = entry.name.split("/").pop();
        const m = nomeArquivo.match(/NF[_-]?(ENTRADA|SAIDA)[_-]?(\d+)/i);
        const direcao = m ? (m[1].toUpperCase()==="ENTRADA" ? "entrada" : "saida") : "";
        const numero = m ? m[2] : "";
        const id = numero ? "NF-"+numero : "NF-IMPORT-"+Math.random().toString(36).slice(2,8);
        if(idsAtuais.includes(id) || novosRascunhos.some(d=>d.id===id)){ ignorados++; return; }
        novosRascunhos.push({
          id, numero, serie:"1", tipo:"NF-e", direcao: direcao||"saida", natureza:"", cfop:"", data:"",
          emitente:{nome:""}, destinatario:{nome:""}, itens:[], impostos:{icms:{valor:0},ipi:{valor:0},pis:{valor:0},cofins:{valor:0},cbs:{valor:0},ibs:{valor:0}},
          totais:{produtos:0,desconto:0,frete:0,seguro:0,outras:0,total:0}, transportador:{}, valorTotal:0,
          completo:false, arquivoNome: nomeArquivo,
        });
      });
      setCatalogo([...catalogo, ...novosRascunhos]);
      setResumoImportacao({ total:pdfEntries.length, importados:novosRascunhos.length, ignorados });
    } catch(e){
      setResumoImportacao({ erro: "Não foi possível ler o arquivo ZIP." });
    }
    setImportando(false);
  }

  return h(React.Fragment, null,
    h("div",{className:"screen-eyebrow"},"03 · documentos fiscais"),
    h("h2",{className:"screen-title"},"Documentos disponibilizados"),
    h("p",{className:"screen-sub"}, role==="professor"
      ? "Catálogo de NF-e didáticas. Cadastre um documento (ou importe vários via ZIP) e libere para a turma "+turma.nome+" — os alunos dessa turma só veem o que estiver marcado como liberado."
      : "NF-e didáticas liberadas pelo professor para a sua turma. O conteúdo detalhado só aparece depois de você digitar a nota na etapa seguinte."),
    role==="professor" && !criando && !editandoDoc && h("div",{className:"btn-row", style:{marginBottom:16}},
      h("button",{className:"btn", onClick:()=>setCriando(true)},"+ Novo documento"),
      h("label",{className:"btn secondary", style:{cursor:"pointer"}},
        importando ? "Importando…" : "Importar ZIP de PDFs",
        h("input",{type:"file", accept:".zip", style:{display:"none"}, disabled:importando, onChange:e=>{ if(e.target.files[0]) importarZip(e.target.files[0]); e.target.value=""; }})
      ),
    ),
    resumoImportacao && h("div",{className:`balance-check ${resumoImportacao.erro?"bad":"ok"}`},
      resumoImportacao.erro || (resumoImportacao.importados+" documento(s) importado(s) como rascunho de "+resumoImportacao.total+" PDF(s) no ZIP"+(resumoImportacao.ignorados?" · "+resumoImportacao.ignorados+" ignorado(s) (já existiam no catálogo)":"")+". Complete os dados de cada um antes de liberar para a turma.")
    ),
    criando && h(NovoDocumentoForm,{
      idsExistentes: catalogo.map(d=>d.id),
      onCancelar:()=>setCriando(false),
      onCriar:(novo)=>{ setCatalogo([...catalogo, novo]); setCriando(false); }
    }),
    editandoDoc && h(NovoDocumentoForm,{
      key:editandoDoc.id,
      idsExistentes: catalogo.map(d=>d.id),
      inicial:{ numero:editandoDoc.numero, direcao:editandoDoc.direcao, arquivoNome:editandoDoc.arquivoNome, idExistente:editandoDoc.id },
      onCancelar:()=>setEditandoDoc(null),
      onCriar:(atualizado)=>{ setCatalogo(catalogo.map(d=>d.id===atualizado.id?atualizado:d)); setEditandoDoc(null); }
    }),
    role==="professor" && h("div",{className:"panel"},
      h("div",{className:"panel-head"}, h("h3",null,"Catálogo — liberar para "+turma.nome)),
      h("div",{className:"panel-body", style:{padding:0}},
        catalogo.length===0 ? h("div",{className:"empty-state"},"Nenhum documento cadastrado ainda.") :
        h("table",null,
          h("thead",null,h("tr",null,
            h("th",null,"Nota"),h("th",null,"Direção"),h("th",null,"Emitente/Destinatário"),h("th",null,"Status"),h("th",null,"")
          )),
          h("tbody",null, catalogo.map(d => {
            const liberado = turma.documentosIds.includes(d.id);
            return h("tr",{key:d.id},
              h("td",{className:"mono"}, d.numero ? "Nº "+d.numero : (d.arquivoNome||d.id)),
              h("td",null, d.direcao==="entrada"?"Entrada":"Saída"),
              h("td",null, (d.direcao==="entrada" ? d.emitente.nome : d.destinatario.nome) || "—"),
              h("td",null, !d.completo
                ? h("span",{className:"status enviado"},"aguardando dados")
                : h("span",{className:`status ${liberado?"aprovado":"rascunho"}`}, liberado?"liberado":"não liberado")),
              h("td",null,
                d.completo
                  ? [
                      h("button",{key:"ver", className:"btn secondary", style:{marginRight:8}, onClick:()=>onAbrir(d)},"ver conteúdo"),
                      h("button",{key:"lib", className:liberado?"btn red":"btn green", onClick:()=>toggleLiberado(d.id)}, liberado?"remover da turma":"liberar para a turma")
                    ]
                  : h("button",{className:"btn", onClick:()=>setEditandoDoc(d)},"completar dados")
              )
            );
          }))
        )
      )
    ),
    h("div",{className:"panel"},
      h("div",{className:"panel-head"}, h("h3",null, role==="professor" ? "Liberados para "+turma.nome : "Suas notas liberadas")),
      h("div",{className:"panel-body", style:{padding:0}},
        liberados.length===0 ? h("div",{className:"empty-state"},"Nenhum documento liberado para esta turma ainda.") :
        h("table",null,
          h("thead",null,h("tr",null,
            h("th",null,"Nota"),h("th",null,"Direção"),h("th",null,"Emitente/Destinatário"),
            h("th",null,"CFOP"),h("th",{className:"num"},"Valor total")
          )),
          h("tbody",null, liberados.map(d => h("tr",{key:d.id, className:"clickable", onClick:()=>onAbrir(d)},
            h("td",{className:"mono"}, "Nº "+d.numero),
            h("td",null, d.direcao==="entrada"?"Entrada":"Saída"),
            h("td",null, d.direcao==="entrada" ? d.emitente.nome : d.destinatario.nome),
            h("td",{className:"mono"}, d.cfop),
            h("td",{className:"num mono"}, fmt(d.valorTotal))
          )))
        )
      )

    )
  );
}

function TelaDigitacaoNFe({documentos, digitacoes, setDigitacoes}){
  const [docSel, setDocSel] = useState(documentos[0]?.id || "");
  const doc = documentos.find(d=>d.id===docSel);
  const form = digitacoes[docSel] || blankDigitacao(doc);
  const [conferido, setConferido] = useState(null);

  function setField(field, value){
    setDigitacoes({...digitacoes, [docSel]: {...form, [field]:value}});
  }
  function setItemField(i, field, value){
    const itens = form.itens.map((it,idx)=> idx===i ? {...it,[field]:value} : it);
    setDigitacoes({...digitacoes, [docSel]: {...form, itens}});
  }
  function addItem(){ setDigitacoes({...digitacoes, [docSel]: {...form, itens:[...form.itens, {codigo:"",descricao:"",ncm:"",cst:"",cfop:"",unidade:"",qtd:"",valorUnit:""}]}}); }
  function removeItem(i){ setDigitacoes({...digitacoes, [docSel]: {...form, itens: form.itens.filter((_,idx)=>idx!==i)}}); }

  function conferir(){
    const somaItens = form.itens.reduce((s,it)=> s + (Number(it.qtd)||0)*(Number(it.valorUnit)||0), 0);
    const totalOk = Math.abs((Number(form.total)||0) - doc.valorTotal) < 0.02;
    const itensOk = Math.abs(somaItens - doc.itens.reduce((s,i)=>s+i.total,0)) < 0.02;
    setConferido({ totalOk, itensOk });
  }

  return h(React.Fragment, null,
    h("div",{className:"screen-eyebrow"},"04 · digitação da nf-e"),
    h("h2",{className:"screen-title"},"Digitar nota fiscal"),
    h("p",{className:"screen-sub"},"Abra o PDF disponibilizado pelo professor e digite os dados da nota exatamente como emitidos. Esta digitação alimenta a análise fiscal e a classificação contábil seguintes."),

      h("div",{className:"panel-head"}, h("h3",null,"Nota a digitar"),
        h("select",{className:"mono", style:{padding:"6px 8px"}, value:docSel, onChange:e=>{setDocSel(e.target.value); setConferido(null);}},
          documentos.map(d=>h("option",{key:d.id, value:d.id}, "Nº "+d.numero+" — "+(d.direcao==="entrada"?"Entrada":"Saída"))))
      ),
      h("div",{className:"panel-body"},
        h("div",{className:"helper-note"}, "Prototipo: os valores reais estão apenas no PDF que o professor disponibiliza fora do sistema. Aqui você digita o que enxerga no documento."),
        h("div",{className:"grid-2"},

        h("div",{className:"grid-2"},
          h("div",{className:"field"}, h("label",null,"CFOP"), h("input",{className:"mono", value:form.cfop, onChange:e=>setField("cfop",e.target.value)})),
          h("div",{className:"field"}, h("label",null,"Data de emissão"), h("input",{type:"date", className:"mono", value:form.data, onChange:e=>setField("data",e.target.value)})),
        ),

function NovoLancamentoForm({onSalvar, documentos, contas}){
  const [data, setData] = useState("");
  const [documento, setDocumento] = useState("");
  const [historico, setHistorico] = useState("");
  const [partidas, setPartidas] = useState([{conta:"",tipo:"D",valor:""},{conta:"",tipo:"C",valor:""}]);

  const totalD = partidas.filter(p=>p.tipo==="D").reduce((s,p)=>s+(Number(p.valor)||0),0);
  const totalC = partidas.filter(p=>p.tipo==="C").reduce((s,p)=>s+(Number(p.valor)||0),0);
  const bate = totalD > 0 && Math.abs(totalD-totalC) < 0.005;

  function updatePartida(i, field, val){
    const novo = [...partidas]; novo[i] = {...novo[i], [field]:val}; setPartidas(novo);
  }
  function addPartida(){ setPartidas([...partidas, {conta:"",tipo:"D",valor:""}]); }
  function removePartida(i){ setPartidas(partidas.filter((_,idx)=>idx!==i)); }

  return h("div",{className:"panel"},
    h("div",{className:"panel-head"}, h("h3",null,"Novo lançamento")),
    h("div",{className:"panel-body"},
      h("div",{className:"grid-2"},
        h("div",{className:"field"}, h("label",null,"Data"), h("input",{type:"date", className:"mono", value:data, onChange:e=>setData(e.target.value)})),
        h("div",{className:"field"}, h("label",null,"Documento de origem"),
          h("select",{value:documento, onChange:e=>setDocumento(e.target.value)},
            h("option",{value:""},"— sem documento —"),
            documentos.map(d=>h("option",{key:d.id, value:d.id}, d.id)))
        ),
      ),
      h("div",{className:"field"}, h("label",null,"Histórico"), h("textarea",{value:historico, onChange:e=>setHistorico(e.target.value)})),
      h("label",{style:{fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", color:"var(--ink-faint)"}}, "Partidas"),
      h("div",{style:{marginTop:8}},
        partidas.map((p,i)=>h("div",{key:i, className:"partida-row"},
          h("select",{value:p.conta, onChange:e=>updatePartida(i,"conta",e.target.value)},
            h("option",{value:""},"Selecione a conta"),
            contas.map(c=>h("option",{key:c.codigo, value:c.codigo}, c.codigo+" — "+c.nome))),
          h("select",{value:p.tipo, onChange:e=>updatePartida(i,"tipo",e.target.value)},
            h("option",{value:"D"},"Débito"), h("option",{value:"C"},"Crédito")),
          h("input",{className:"mono", placeholder:"Valor", type:"number", value:p.valor, onChange:e=>updatePartida(i,"valor",e.target.value)}),
          h("div",{className:"mono",style:{fontSize:"12px",color:"var(--ink-faint)"}}, p.tipo==="D"?"a débito":"a crédito"),
          partidas.length>2 ? h("button",{className:"remove-partida", onClick:()=>removePartida(i)},"×") : h("span",null)
        ))
      ),
      h("button",{className:"btn secondary", style:{marginTop:6}, onClick:addPartida},"+ adicionar partida"),
      h("div",{className:`balance-check ${bate?"ok":"bad"}`},
        h("span",null, "Débitos: "+fmt(totalD)+"  ·  Créditos: "+fmt(totalC)),
        h("span",null, bate ? "✓ Débito = Crédito" : "✗ Lançamento desequilibrado — não pode ser enviado")
      ),
      h("div",{className:"btn-row"},
        h("button",{className:"btn secondary", onClick:()=>onSalvar({data,documento,historico,partidas,status:"rascunho"})}, "Salvar como rascunho"),
        h("button",{className:"btn", disabled:!bate || !historico, onClick:()=>onSalvar({data,documento,historico,partidas,status:"enviado"})}, "Enviar para análise do professor"),
      )
    )
  );
}

const PDFJS_VERSION = "4.4.168";
let pdfjsLibCache = null;
async function carregarPdfJs(){
  if(!pdfjsLibCache){
    pdfjsLibCache = await import(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.mjs`);
    pdfjsLibCache.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.mjs`;
  }
  return pdfjsLibCache;
}

async function extrairLinhasPdf(file){
  const pdfjsLib = await carregarPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({data:buf}).promise;
  const linhas = [];
  for(let p=1; p<=doc.numPages; p++){
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const porY = {};
    content.items.forEach(it => {
      const y = Math.round(it.transform[5]/3)*3;
      (porY[y] = porY[y]||[]).push(it);
    });
    Object.keys(porY).map(Number).sort((a,b)=>b-a).forEach(y => {
      const ordenados = porY[y].sort((a,b)=>a.transform[4]-b.transform[4]);
      const partes = [];
      ordenados.forEach(it => {
        const s = it.str;
        if(!s.trim()) return;
        if(partes.length && partes[partes.length-1]===s) return; // descarta texto duplicado sobreposto (efeito de negrito falso comum em impressão web→PDF)
        partes.push(s);
      });
      const linha = partes.join(" ").replace(/\s+/g," ").trim();
      if(linha) linhas.push(linha);
    });
  }
  return linhas;
}

function undoubleToken(tok){
  const n = tok.length;
  if(n < 2 || n % 2 !== 0) return tok;
  for(let i=0;i<n;i+=2){ if(tok[i]!==tok[i+1]) return tok; }
  let out = ""; for(let i=0;i<n;i+=2) out += tok[i];
  return out;
}
function undoubleLinha(linha){
  return linha.split(" ").map(undoubleToken).join(" ");
}

function candidatosDeLinhas(linhas){
  const candidatos = [];
  const vistas = new Set();
  linhas.forEach(linhaOriginal => {
    const linha = undoubleLinha(linhaOriginal);
    const mMatricula = linha.match(/\d{6,12}/);
    if(!mMatricula) return;
    if(vistas.has(mMatricula[0])) return;
    let nome = (linha.slice(0,mMatricula.index) + linha.slice(mMatricula.index+mMatricula[0].length))
      .replace(/^\s*\d+/, "")
      .replace(/matr[íi]cula|\bnome( do aluno| completo)?\b|\baluno\b/gi, "")
      .replace(/[:\-|]/g, " ").replace(/\s+/g, " ").trim();
    const palavras = nome.split(" ").filter(w => /^[A-Za-zÀ-ÿ.']+$/.test(w));
    if(palavras.length < 2) return;
    vistas.add(mMatricula[0]);
    candidatos.push({ nome: palavras.join(" "), matricula: mMatricula[0], incluir:true });
  });
  return candidatos;
}

function TelaFilaCorrecao({dadosAlunos, setDadosAlunos, alunos, contas, documentos}){
  const [obs, setObs] = useState({});
  const [analise, setAnalise] = useState({}); // { [chave]: {loading, resultado:{status,feedback}, erro} }
  const [iaIndisponivel, setIaIndisponivel] = useState(false);

  function chave(matricula, id){ return matricula+"-"+id; }

  function atualizarLancamento(matricula, id, mudar){
    setDadosAlunos(prev => ({...prev, [matricula]: {...prev[matricula], lancamentos: (prev[matricula]?.lancamentos||[]).map(l => l.id===id ? mudar(l) : l)}}));
  }
  function aprovar(matricula, id){ atualizarLancamento(matricula, id, l => ({...l, status:"aprovado"})); }
  function devolver(matricula, id){ atualizarLancamento(matricula, id, l => ({...l, status:"correcao", obsCorrecao: obs[chave(matricula,id)] || "Revisar lançamento."})); }

  const fila = alunos.flatMap(al => (dadosAlunos[al.matricula]?.lancamentos || [])
    .filter(l=>l.status==="enviado")
    .map(l => ({aluno:al, lancamento:l})));

  async function analisarComIA(matricula, l){
    const k = chave(matricula, l.id);
    setAnalise(prev => ({...prev, [k]:{loading:true}}));
    const sample = await (window.claude ? window.claude.use("sample") : Promise.resolve(null));
    if(!sample){ setIaIndisponivel(true); setAnalise(prev=>({...prev,[k]:null})); return; }

    const doc = documentos.find(d=>d.id===l.documento);
    const partidasTexto = l.partidas.map(p => {
      const c = contaInfo(p.conta, contas);
      return (p.tipo==="D"?"Débito":"Crédito")+" — "+p.conta+" "+(c?c.nome:"(conta não encontrada)")+" — R$ "+fmt(p.valor);
    }).join("\n");
    const docTexto = doc
      ? "Documento de origem: NF-e nº "+doc.numero+", "+(doc.direcao==="entrada"?"entrada":"saída")+", natureza \""+doc.natureza+"\", CFOP "+doc.cfop+", itens: "+doc.itens.map(i=>i.qtd+" "+i.unidade+" "+i.descricao).join("; ")+", valor total R$ "+fmt(doc.valorTotal)+"."
      : "Sem documento de origem vinculado.";

    const prompt = `Você é um professor de Contabilidade Intermediária revisando o lançamento de um aluno do ensino técnico, na Unidade II (Operações com Mercadorias e Operações Financeiras).

${docTexto}

Histórico informado pelo aluno: "${l.historico}"

Partidas do lançamento:
${partidasTexto}

Avalie se a classificação contábil (contas escolhidas, natureza débito/crédito, separação de efeitos quando aplicável — ex.: em vendas, receita e CMV devem ser lançados separadamente) está coerente com o fato descrito e com o documento de origem. Não é preciso que bata com uma única "resposta certa" — julgue como um professor experiente julgaria, aceitando soluções tecnicamente corretas ainda que diferentes da mais óbvia.

Responda em português, em JSON, exatamente neste formato:
{"status": "ok" ou "inconsistencias", "feedback": "texto para o aluno, direto e didático, sem revelar a conta certa caso haja erro — aponte o que reconsiderar, não a resposta"}

Se estiver tudo certo, "feedback" deve parabenizar o aluno e destacar en poucas palavras o que ele acertou. Se houver inconsistência, "feedback" deve orientar o que o aluno deve reexaminar (ex.: "revise se esta operação deveria reconhecer também a baixa do estoque"), sem entregar a conta ou o lançamento corretos.`;

    try{
      const resultado = await sample.json(prompt, {modelTier:"default"});
      setAnalise(prev => ({...prev, [k]:{loading:false, resultado}}));
      if(resultado.status==="inconsistencias" && resultado.feedback){
        setObs(prevObs => ({...prevObs, [k]: resultado.feedback}));
      }
    } catch(e){
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){
        setIaIndisponivel(true);
        setAnalise(prev=>({...prev,[k]:null}));
      } else {
        setAnalise(prev => ({...prev, [k]:{loading:false, erro: e.code==="rate_limited" ? "Muitas análises seguidas — aguarde um momento e tente de novo." : "Não foi possível concluir a análise agora."}}));
      }
    }
  }

  return h(React.Fragment, null,
    h("div",{className:"screen-eyebrow"},"fila de correção"),
    h("h2",{className:"screen-title"},"Lançamentos enviados para análise"),
    h("p",{className:"screen-sub"},"De todos os alunos da turma. Compare cada lançamento com o documento de origem antes de aprovar ou devolver."),
    fila.length===0 && h("div",{className:"panel"}, h("div",{className:"empty-state"},"Nenhum lançamento pendente no momento.")),
    fila.map(({aluno, lancamento:l}) => {
      const k = chave(aluno.matricula, l.id);
      const a = analise[k];
      return h("div",{className:"panel", key:k},
      h("div",{className:"panel-head"},
        h("div",null,
          h("div",{className:"mono", style:{fontSize:"10.5px", color:"var(--ink-faint)", marginBottom:2}}, aluno.nome),
          h("h3",{style:{margin:0}}, l.data+" · "+l.documento+" — "+l.historico)
        ),
        h(StatusBadge,{status:l.status})
      ),
      h("div",{className:"panel-body"},
        h("table",null,
          h("thead",null,h("tr",null,h("th",null,"Conta"),h("th",{className:"num"},"Débito"),h("th",{className:"num"},"Crédito"))),
          h("tbody",null, l.partidas.map((p,i)=>h("tr",{key:i},
            h("td",{className:"mono"}, p.conta+" — "+(contaInfo(p.conta, contas)?.nome||"")),
            h("td",{className:"num mono"}, p.tipo==="D"?fmt(p.valor):""),
            h("td",{className:"num mono"}, p.tipo==="C"?fmt(p.valor):"")
          )))
        ),
        !iaIndisponivel && h("div",{className:"btn-row", style:{marginTop:12}},
          h("button",{className:"btn secondary", disabled:a?.loading, onClick:()=>analisarComIA(aluno.matricula, l)}, a?.loading ? "Analisando…" : "Analisar com IA")
        ),
        a?.erro && h("div",{className:"balance-check bad", style:{marginTop:10}}, a.erro),
        a?.resultado && h("div",{className:`balance-check ${a.resultado.status==="ok"?"ok":"bad"}`, style:{marginTop:10, display:"block"}},
          h("div",{style:{fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", marginBottom:4}}, a.resultado.status==="ok" ? "✓ parecer da IA — sem inconsistências aparentes" : "✗ parecer da IA — possíveis inconsistências"),
          h("div",{style:{fontFamily:"'Source Serif 4', serif"}}, a.resultado.feedback)
        ),
        h("div",{className:"field", style:{marginTop:12}}, h("label",null,"Observação (caso devolva para correção)"),
          h("textarea",{value:obs[k]||"", onChange:e=>setObs({...obs,[k]:e.target.value})})),
        h("div",{className:"btn-row"},
          h("button",{className:"btn green", onClick:()=>aprovar(aluno.matricula, l.id)},"Aprovar"),
          h("button",{className:"btn red", onClick:()=>devolver(aluno.matricula, l.id)},"Devolver para correção"),
        )
      )
    );
    })
  );
}

function App(){
  const [role, setRole] = useState("aluno");
  const [screen, setScreen] = useState("dashboard");
  const [dadosAlunos, setDadosAlunos] = useState(DADOS_ALUNOS_INICIAL);
  const [contas, setContas] = useState(PLANO_CONTAS_INICIAL);
  const [catalogo, setCatalogo] = useState(DOCUMENTOS_CATALOGO_INICIAL);
  const [turmas, setTurmas] = useState(TURMAS_INICIAL);
  const [turmaAtualId, setTurmaAtualIdRaw] = useState(TURMAS_INICIAL[0].id);
  const [matriculaAtiva, setMatriculaAtiva] = useState(TURMAS_INICIAL[0].alunos[0].matricula);
  const [drill, setDrill] = useState(null);
  const [docAberto, setDocAberto] = useState(null);
  const [sessaoEncerrada, setSessaoEncerrada] = useState(false);
  const [acessado, setAcessado] = useState(false);
  const [statusBackup, setStatusBackup] = useState({estado:"idle"}); // idle | gerando | erro

  const turmaAtual = turmas.find(t=>t.id===turmaAtualId) || turmas[0];
  const alunoAtivo = turmaAtual.alunos.find(a=>a.matricula===matriculaAtiva) || turmaAtual.alunos[0];
  function setTurmaAtualId(id){
    setTurmaAtualIdRaw(id);
    const nova = turmas.find(t=>t.id===id);
    if(nova && nova.alunos[0]) setMatriculaAtiva(nova.alunos[0].matricula);
  }
  const dadosAtivos = (alunoAtivo && dadosAlunos[alunoAtivo.matricula]) || {lancamentos:[], digitacoes:{}, classificacoes:[]};
  const lancamentos = dadosAtivos.lancamentos;
  const digitacoes = dadosAtivos.digitacoes;
  const classificacoes = dadosAtivos.classificacoes;
  function setLancamentos(novo){
    setDadosAlunos(prev => ({...prev, [matriculaAtiva]: {...(prev[matriculaAtiva]||{digitacoes:{},classificacoes:[]}), lancamentos: typeof novo==="function" ? novo(prev[matriculaAtiva]?.lancamentos||[]) : novo}}));
  }
  function setDigitacoes(novo){
    setDadosAlunos(prev => ({...prev, [matriculaAtiva]: {...(prev[matriculaAtiva]||{lancamentos:[],classificacoes:[]}), digitacoes: typeof novo==="function" ? novo(prev[matriculaAtiva]?.digitacoes||{}) : novo}}));
  }
  function setClassificacoes(novo){
    setDadosAlunos(prev => ({...prev, [matriculaAtiva]: {...(prev[matriculaAtiva]||{lancamentos:[],digitacoes:{}}), classificacoes: typeof novo==="function" ? novo(prev[matriculaAtiva]?.classificacoes||[]) : novo}}));
  }

  const razao = useMemo(()=>calcularRazao(lancamentos, contas), [lancamentos, contas]);
  const dre = useMemo(()=>calcularDRE(razao), [razao]);
  const bp = useMemo(()=>calcularBP(razao, dre.resultadoExercicio), [razao, dre]);

  function trocarRole(r){ setRole(r); setScreen(r==="professor"?"painel":"dashboard"); }

  async function sairComBackup(){
    setStatusBackup({estado:"gerando"});
    const backup = {
      geradoEm: new Date().toISOString(),
      papel: role, aluno: alunoAtivo.nome, matricula: alunoAtivo.matricula, empresa: EMPRESA.nome, turma: turmaAtual.nome,
      contas, turmas, catalogo, dadosAlunos,
    };
    const downloads = window.claude ? await window.claude.use("downloads") : null;
    if(!downloads){
      setStatusBackup({estado:"erro", msg:"Download de backup não está disponível nesta visualização."});
      return;
    }
    try{
      const nomeArquivo = "backup-ci-unidadeII-"+role+"-"+new Date().toISOString().slice(0,10)+".json";
      await downloads.save({ filename: nomeArquivo, data: JSON.stringify(backup, null, 2) });
      setStatusBackup({estado:"idle"});
      setSessaoEncerrada(true);
    } catch(e){
      const msg = e.code==="declined" ? "Backup cancelado — você continua na sessão."
        : e.code==="rate_limited" ? "Muitos pedidos de download seguidos — tente de novo em instantes."
        : "Não foi possível gerar o backup agora.";
      setStatusBackup({estado:"erro", msg});
    }

  const menu = role==="professor" ? MENU_PROFESSOR : MENU_ALUNO;

    else if(screen==="digitacao") tela = h(TelaDigitacaoNFe,{documentos:documentosTurma, digitacoes, setDigitacoes});
    else if(screen==="analise") tela = h(TelaAnaliseFiscal,{documentos:documentosTurma});
    else if(screen==="plano") tela = h(TelaPlanoContas,{contas, setContas, role});
    else if(screen==="classificacao") tela = h(TelaClassificacaoContabil,{documentos:documentosTurma, contas, classificacoes, setClassificacoes});
    else if(screen==="diario") tela = h(TelaDiario,{lancamentos, setLancamentos, documentos:documentosTurma, contas});
    else if(screen==="razao") tela = h(TelaRazao,{razao});
    else if(screen==="balancete") tela = h(TelaBalancete,{razao});
    else if(screen==="are") tela = h(TelaARE,{dre});
    else if(screen==="dre") tela = h(TelaDRE,{dre, onDrill:setDrill});
    else if(screen==="bp") tela = h(TelaBP,{bp, onDrill:setDrill});
  } else {
    if(screen==="painel") tela = h(TelaPainelProfessor,{goto:setScreen, turma:turmaAtual, turmas, setTurmas, dadosAlunos});
    else if(screen==="turmas") tela = h(TelaTurmas,{turmas, setTurmas, turmaAtualId, setTurmaAtualId, dadosAlunos});
    else if(screen==="fila") tela = h(TelaFilaCorrecao,{dadosAlunos, setDadosAlunos, alunos:turmaAtual.alunos, contas, documentos:catalogo});
    else if(screen==="historico") tela = h(TelaHistoricoLancamentos,{lancamentos, contas, turma:turmaAtual, alunoAtivo});
    else if(screen==="documentos") tela = h(TelaDocumentos,{onAbrir:setDocAberto, role, turma:turmaAtual, turmas, setTurmas, catalogo, setCatalogo});
    else if(screen==="plano") tela = h(TelaPlanoContas,{contas, setContas, role});
    else if(screen==="razao") tela = h(TelaRazao,{razao});
    else if(screen==="balancete") tela = h(TelaBalancete,{razao});
    else if(screen==="dre") tela = h(TelaDRE,{dre, onDrill:setDrill});
    else if(screen==="bp") tela = h(TelaBP,{bp, onDrill:setDrill});
  }

  if(sessaoEncerrada){
    return h("div",{style:{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--paper)"}},
      h("div",{className:"panel", style:{maxWidth:420, textAlign:"center"}},
        h("div",{className:"panel-body"},
          h("div",{style:{fontSize:"28px", marginBottom:8}}, "📒"),
          h("h2",{style:{margin:"0 0 8px 0"}}, "Sessão encerrada"),
          h("p",{style:{color:"var(--ink-soft)", fontSize:"14px", margin:"0 0 18px 0"}}, "Backup gerado e salvo no seu dispositivo antes de sair."),
          h("button",{className:"btn", onClick:()=>{ setSessaoEncerrada(false); setAcessado(false); }}, "Entrar novamente")
        )
      )
    );
  }

  if(!acessado){
    return h(TelaAcesso,{onEntrar:()=>setAcessado(true)});
  }

  return h("div",{className:"app"},
    h("div",{className:"sidebar"},
      h("div",{className:"sidebar-head"},
        h("div",{className:"kicker"},"CI · UNIDADE II"),
        h("h1",null,"Escrituração Contábil")
      ),
      h("div",{className:"nav-group"},
        h("div",{className:"nav-group-label"}, role==="professor"?"professor":"aluno"),
        menu.map(item => h("div",{
            key:item.key,
            className:"nav-item"+(screen===item.key?" active":""),
            onClick:()=>setScreen(item.key)
          },
          h("span",{className:"num mono"}, item.num),
          h("span",null, item.label)
        ))
      ),
      h("div",{className:"sidebar-foot"}, "protótipo · dados fictícios · sem Firebase")
    ),
    h("div",{className:"main"},
      h("div",{className:"topbar"},
        h("div",{className:"empresa"}, "Empresa didática de: ",
          h("select",{className:"mono", style:{padding:"4px 6px", fontSize:"13px"}, value:matriculaAtiva, onChange:e=>setMatriculaAtiva(e.target.value)},
            turmaAtual.alunos.map(a=>h("option",{key:a.matricula||a.nome, value:a.matricula}, a.nome)))
        ),
        h("div",{className:"role-switch"},
          "Login demonstrativo:",
          h("button",{className:"role-btn"+(role==="aluno"?" active":""), onClick:()=>trocarRole("aluno")},"Aluno"),
          h("button",{className:"role-btn"+(role==="professor"?" active":""), onClick:()=>trocarRole("professor")},"Professor"),
          h("button",{className:"role-btn", style:{marginLeft:14}, disabled:statusBackup.estado==="gerando", onClick:sairComBackup}, statusBackup.estado==="gerando" ? "Gerando backup…" : "Sair (gera backup)"),
          statusBackup.estado==="erro" && h("span",{className:"mono", style:{color:"var(--red)", fontSize:"11px", marginLeft:8}}, statusBackup.msg),
        )
      ),
      h("div",{className:"content"}, tela)
    ),
    h(DrillModal,{item:drill, onClose:()=>setDrill(null)}),
    docAberto && h("div",{className:"modal-backdrop", onClick:()=>setDocAberto(null)},
      h("div",{className:"modal", onClick:e=>e.stopPropagation()},
        h("div",{className:"modal-head"}, h("h3",null,"NF-e Nº "+docAberto.numero+" — "+(docAberto.direcao==="entrada"?"Entrada":"Saída")), h("button",{className:"modal-close", onClick:()=>setDocAberto(null)},"fechar ×")),
        role==="professor" ? h("div",{className:"modal-body"},
          h("div",{className:"field"}, h("label",null,"Natureza / CFOP"), h("div",{className:"mono"}, docAberto.natureza+" · "+docAberto.cfop)),
          h("div",{className:"field"}, h("label",null, docAberto.direcao==="entrada"?"Emitente":"Destinatário"),
            h("div",null, (docAberto.direcao==="entrada"?docAberto.emitente:docAberto.destinatario).nome)),
          h("label",{style:{fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", color:"var(--ink-faint)"}},"Itens"),
          h("table",{style:{marginTop:6}},
            h("thead",null,h("tr",null,h("th",null,"Descrição"),h("th",null,"NCM"),h("th",null,"CST"),h("th",{className:"num"},"Qtd"),h("th",{className:"num"},"Total"))),
            h("tbody",null, docAberto.itens.map((it,i)=>h("tr",{key:i},
              h("td",null,it.descricao), h("td",{className:"mono"},it.ncm), h("td",{className:"mono"},it.cst),
              h("td",{className:"num mono"},it.qtd), h("td",{className:"num mono"},fmt(it.total))
            )))
          ),
          h("div",{className:"field", style:{marginTop:14}}, h("label",null,"Impostos"),
            h("div",{className:"mono", style:{fontSize:"12.5px", lineHeight:1.8}},
              "ICMS "+fmt(docAberto.impostos.icms.valor)+" · PIS "+fmt(docAberto.impostos.pis.valor)+" · COFINS "+fmt(docAberto.impostos.cofins.valor)+" (contabilizados)",
              h("br"), "CBS "+fmt(docAberto.impostos.cbs.valor)+" · IBS "+fmt(docAberto.impostos.ibs.valor)+" (informativos — transição 2026, sem contabilização didática)"
            )),
          h("div",{className:"field"}, h("label",null,"Valor total da nota"), h("div",{className:"mono"}, "R$ "+fmt(docAberto.valorTotal))),
        ) : h("div",{className:"modal-body"},
          h("p",{style:{margin:0,color:"var(--ink-soft)",fontSize:"14px"}},
            "O conteúdo desta nota está no PDF disponibilizado pelo professor, fora deste sistema. Abra o PDF e siga para a etapa "),
          h("p",{style:{margin:"10px 0 0 0"}}, h("b",null,"04 · Digitação da NF-e"), " para registrar os dados aqui.")
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
